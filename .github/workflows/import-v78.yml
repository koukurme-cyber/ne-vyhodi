name: Import verified v78 from SprintHost

on:
  push:
    paths:
      - .github/workflows/import-v78.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ib-game-v78
      - name: Fetch and verify all original files
        env:
          BASE_URL: http://ib-game.ru.xsph.ru
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import time
          import urllib.request

          base = __import__("os").environ["BASE_URL"].rstrip("/")
          out = pathlib.Path("/tmp/ib-game-v78-verified")
          out.mkdir(parents=True, exist_ok=True)

          def get(path):
              url = base + "/" + path
              error = None
              for i in range(3):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (compatible; game-migration/1.0)"})
                      with urllib.request.urlopen(req, timeout=45) as f:
                          if f.status != 200:
                              raise RuntimeError(f"HTTP {f.status} for {path}")
                          return f.read()
                  except Exception as e:
                      error = e
                      time.sleep(i + 1)
              raise RuntimeError(f"Cannot download {path}: {error}")

          def sha(b):
              return hashlib.sha256(b).hexdigest()

          raw = get("VERSION.json")
          assert sha(raw) == "370d3c6f81ada448e46fa9bc8bfd0c08ca696bd5818da28b312c102cc7fcee48", "Wrong VERSION.json from SprintHost; refuse migration"
          manifest = json.loads(raw)
          assert manifest.get("version") == 78 and len(manifest["files"]) == 50
          (out / "VERSION.json").write_bytes(raw)
          for f in manifest["files"]:
              path = f["path"]
              assert not path.startswith("/") and ".." not in pathlib.PurePosixPath(path).parts
              data = get(path)
              assert len(data) == f["bytes"] and sha(data) == f["sha256"], f"Invalid asset: {path}"
              dest = out / path
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)
              print("verified:", path, flush=True)
          extra = get("START_HERE.txt")
          assert sha(extra) == "8c890d96bf55ecd2fbe135b0dc82c33260084b0ec59717e6b4c5ee4373b565cd"
          (out / "START_HERE.txt").write_bytes(extra)
          print("All 52 v78 files verified", flush=True)
          PY
      - name: Replace only the isolated branch contents
        run: |
          git rm -qr -- .
          cp -a /tmp/ib-game-v78-verified/. .
          git add -A
          git -c user.name='game-sync[bot]' -c user.email='game-sync@users.noreply.github.com' commit -m 'Import complete verified v78 from SprintHost'
          git push origin HEAD:ib-game-v78
